name: Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install stable Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build installable beta APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "GoldArbitrager-${GITHUB_REF_NAME}-beta.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "GoldArbitrager-${GITHUB_REF_NAME}-beta.apk"
          --title "Gold Arbitrager ${GITHUB_REF_NAME} Beta"
          --notes "نسخه آزمایشی قابل نصب؛ شامل رابط RTL، محاسبه هزینه کامل و اعتبارسنجی timestamp جلالی گلدیس. این نسخه سفارش واقعی ارسال نمی‌کند."
