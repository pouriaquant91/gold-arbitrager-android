name: Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify local distribution contract
        run: node scripts/verify-distribution-contract.mjs
      - name: Verify Core contract when cross-repo token is configured
        if: ${{ env.ZARGARD_SYNC_TOKEN != '' }}
        env:
          ZARGARD_SYNC_TOKEN: ${{ secrets.ZARGARD_SYNC_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ZARGARD_SYNC_TOKEN" \
            https://raw.githubusercontent.com/daredevilbizdev/gold-arbitrager/main/.zargard/distribution-contract.json \
            --output /tmp/core-distribution-contract.json
          cmp /tmp/core-distribution-contract.json .zargard/distribution-contract.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
      - name: Install stable Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build installable beta APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare release asset
        run: cp app/build/outputs/apk/debug/app-debug.apk "ZarGard-android-${GITHUB_REF_NAME#android-v}-beta.apk"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "ZarGard-android-${GITHUB_REF_NAME#android-v}-beta.apk"
          --title "زرگَرد ${GITHUB_REF_NAME} Beta"
          --notes "نسخه آزمایشی قابل نصب زرگَرد با تمرکز بر آربیتراژ مستقیم طلای ۱۸ عیار، رابط Emerald، تم تیره/روشن، قفل اثر انگشت و پایش برگشت جهت. XAUT در این نسخه متوقف است و برنامه سفارش واقعی ارسال نمی‌کند."
