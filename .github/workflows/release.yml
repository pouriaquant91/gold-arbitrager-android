name: Android Release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Verify local distribution contract
        run: node scripts/verify-distribution-contract.mjs
      - name: Verify Core contract when cross-repo token is configured
        if: ${{ env.ZARGARD_SYNC_TOKEN != '' }}
        env:
          ZARGARD_SYNC_TOKEN: ${{ secrets.ZARGARD_SYNC_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            --header "Authorization: Bearer $ZARGARD_SYNC_TOKEN" \
            https://raw.githubusercontent.com/daredevilbizdev/gold-arbitrager/main/.zargard/distribution-contract.json \
            --output /tmp/core-distribution-contract.json
          cmp /tmp/core-distribution-contract.json .zargard/distribution-contract.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - uses: android-actions/setup-android@v3
        with:
          packages: ''
      - name: Install stable Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Test and build installable beta APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace
      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "RASAD-android-${GITHUB_REF_NAME#android-v}-beta.apk"
          sha256sum "RASAD-android-${GITHUB_REF_NAME#android-v}-beta.apk" > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          "RASAD-android-${GITHUB_REF_NAME#android-v}-beta.apk"
          SHA256SUMS.txt
          --title "رصد ${GITHUB_REF_NAME} Beta"
          --prerelease
          --notes "اصلاح سود/زیان با علامت واقعی، تطبیق تمام fillهای دو پایه، حذف رکورد تکراری و هشدار ارزش‌گذاری ناقص؛ قرارداد v11. APK آزمایشی debug-signed است؛ برای اپ debug قبلی سازگاری کلید امضا باید جداگانه بررسی شود. برنامه سفارش واقعی ارسال نمی‌کند."
